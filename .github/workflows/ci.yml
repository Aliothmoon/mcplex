name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test & Cross-Compile (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet (Linux, macOS, Windows targets)
        run: |
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Run unit & integration tests (with race detector)
        run: go test -race -count=1 ./...

      - name: Cross-compile static binaries (all platforms)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "dist/mcplex_${GOOS}_${GOARCH}${ext}" ./cmd/mcplex
          done
          ./dist/mcplex_linux_amd64 version
          ls -lh dist/
